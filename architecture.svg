<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555c66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="700" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">URL Shortener — Architecture</text>

  <!-- Client -->
  <rect x="380" y="60" width="220" height="60" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="490" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3f8f">React + Vite Frontend</text>
  <text x="490" y="104" text-anchor="middle" font-size="11.5" fill="#3a4a63">Dashboard · Analytics · Auth UI</text>

  <line x1="490" y1="120" x2="490" y2="158" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="504" y="144" font-size="10.5" fill="#5b6472">HTTPS / JWT Bearer</text>

  <!-- API -->
  <rect x="330" y="160" width="320" height="96" rx="10" fill="#eef1ff" stroke="#5b4fd6" stroke-width="1.5"/>
  <text x="490" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#332a8f">Spring Boot REST API</text>
  <text x="490" y="205" text-anchor="middle" font-size="11.5" fill="#3a3a63">Auth · Url · Redirect Controllers</text>
  <text x="490" y="222" text-anchor="middle" font-size="11.5" fill="#3a3a63">JWT Auth Filter · Rate Limit Filter</text>
  <text x="490" y="240" text-anchor="middle" font-size="11.5" fill="#3a3a63">Global Exception Handler</text>

  <!-- Scheduler -->
  <rect x="700" y="172" width="180" height="60" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5"/>
  <text x="790" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5300">Url Cleanup Scheduler</text>
  <text x="790" y="213" text-anchor="middle" font-size="10.5" fill="#7a5300">Cron: purges expired URLs</text>
  <line x1="700" y1="205" x2="654" y2="205" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row of stores -->
  <line x1="410" y1="256" x2="240" y2="330" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="256" x2="490" y2="330" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="256" x2="740" y2="330" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="120" y="332" width="220" height="72" rx="10" fill="#eafaf0" stroke="#1f9d55" stroke-width="1.5"/>
  <text x="230" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e6b34">PostgreSQL</text>
  <text x="230" y="376" text-anchor="middle" font-size="11" fill="#0e6b34">Users · Urls · Analytics</text>
  <text x="230" y="392" text-anchor="middle" font-size="11" fill="#0e6b34">tables (JPA / Hibernate)</text>

  <!-- Redis -->
  <rect x="380" y="332" width="220" height="72" rx="10" fill="#fdeaea" stroke="#c62828" stroke-width="1.5"/>
  <text x="490" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f1d1d">Redis Cache</text>
  <text x="490" y="376" text-anchor="middle" font-size="11" fill="#8f1d1d">shortCode → originalUrl</text>
  <text x="490" y="392" text-anchor="middle" font-size="11" fill="#8f1d1d">fast redirect lookups</text>

  <!-- Kafka -->
  <rect x="640" y="332" width="220" height="72" rx="10" fill="#fff1e6" stroke="#c9660c" stroke-width="1.5"/>
  <text x="750" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f4a0e">Kafka</text>
  <text x="750" y="376" text-anchor="middle" font-size="11" fill="#8f4a0e">AnalyticsEvent topic</text>
  <text x="750" y="392" text-anchor="middle" font-size="11" fill="#8f4a0e">async click tracking</text>

  <!-- Kafka -> Consumer -->
  <line x1="750" y1="404" x2="750" y2="452" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="630" y="454" width="240" height="60" rx="10" fill="#fff1e6" stroke="#c9660c" stroke-width="1.5"/>
  <text x="750" y="478" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f4a0e">Analytics Consumer</text>
  <text x="750" y="495" text-anchor="middle" font-size="10.5" fill="#8f4a0e">writes click + device/geo data</text>

  <!-- Consumer -> Postgres -->
  <path d="M630,484 C420,484 260,460 230,404" fill="none" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API -> Prometheus -->
  <line x1="410" y1="256" x2="250" y2="562" stroke="#555c66" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="270" y="500" font-size="10.5" fill="#5b6472">/actuator/prometheus</text>

  <!-- Prometheus -->
  <rect x="120" y="564" width="200" height="60" rx="10" fill="#f2edfb" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="220" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2e8f">Prometheus</text>
  <text x="220" y="605" text-anchor="middle" font-size="10.5" fill="#4a2e8f">metrics scraping</text>

  <line x1="320" y1="594" x2="378" y2="594" stroke="#555c66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Grafana -->
  <rect x="380" y="564" width="200" height="60" rx="10" fill="#f2edfb" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="480" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2e8f">Grafana</text>
  <text x="480" y="605" text-anchor="middle" font-size="10.5" fill="#4a2e8f">dashboards</text>

  <!-- Legend -->
  <text x="700" y="650" font-size="11" fill="#5b6472">Solid = request/data flow</text>
  <text x="700" y="666" font-size="11" fill="#5b6472">Dashed = metrics scrape</text>
</svg>
